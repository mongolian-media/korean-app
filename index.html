<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Солонгос Яриа">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/app-icon-512.png">
  <link rel="shortcut icon" href="/apple-touch-icon.png">
  <title>MONGOLIAN MEDIA — Солонгос хэлний сургалт</title>
  <link rel="stylesheet" href="css/glassmorphism.css">
  <script>
    (function() {
      if (!('serviceWorker' in navigator)) return;

      function showBadge(msg) {
        var b = document.getElementById('offline-ready-badge');
        if (!b) {
          b = document.createElement('div');
          b.id = 'offline-ready-badge';
          b.style.cssText = 'position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#059669,#10b981);color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,0.5);z-index:99999;display:flex;align-items:center;gap:8px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;animation:fadeIn 0.4s ease;';
          b.onclick = function() { b.remove(); };
          if (document.body) {
            document.body.appendChild(b);
          } else {
            window.addEventListener('DOMContentLoaded', function() { document.body.appendChild(b); });
          }
        }
        b.innerHTML = '<span>🟢</span><span>' + (msg || 'Офлайн горим бэлэн боллоо (Интернэтгүй ажиллана)') + '</span>';
      }

      navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
        console.log('[SW Head] Registered:', reg.scope);
        if (reg.active) showBadge();
        if (reg.installing) {
          reg.installing.addEventListener('statechange', function(e) {
            if (e.target.state === 'activated') showBadge();
          });
        }
        if (reg.waiting) {
          reg.waiting.addEventListener('statechange', function(e) {
            if (e.target.state === 'activated') showBadge();
          });
        }
      }).catch(function(e) { console.warn('[SW Head Err]', e); });

      navigator.serviceWorker.addEventListener('controllerchange', function() {
        showBadge();
      });

      if ('caches' in window) {
        var pollCount = 0;
        var pollTimer = setInterval(function() {
          pollCount++;
          caches.keys().then(function(keys) {
            var targetKey = keys.find(function(k) { return k.indexOf('mm-korean') !== -1; });
            if (targetKey) {
              caches.open(targetKey).then(function(c) {
                // Verify actual critical assets are in cache, NEVER just the cache name!
                Promise.all([
                  c.match('/index.html', { ignoreSearch: true }),
                  c.match('/js/app.js', { ignoreSearch: true }),
                  c.match('/js/curriculum_data.js', { ignoreSearch: true })
                ]).then(function(matches) {
                  var allFound = matches.every(function(m) { return m && m.ok; });
                  if (allFound) {
                    showBadge('🟢 Офлайн горим 100% бэлэн (Бүх файл суусан)');
                    clearInterval(pollTimer);
                  }
                }).catch(function() {});
              }).catch(function() {});
            }
            if (pollCount > 15) {
              clearInterval(pollTimer);
            }
          }).catch(function() { clearInterval(pollTimer); });
        }, 800);
      }
    })();
  </script>
</head>
<body>
  <!-- Ambient background glow elements (isolated in fixed viewport container) -->
  <div style="position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; pointer-events: none; z-index: 0;">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
  </div>

  <!-- Main Container -->
  <div class="app-container">
    <!-- PWA Installation Banner -->
    <div id="pwa-install-bar">
      <div class="banner-left">
        <span style="font-size: 20px;">📲</span>
        <span>Аппыг гар утсан дээрээ суулгах уу?</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="btn-pwa-install" class="banner-btn" style="display: none;">Суулгах</button>
        <button id="btn-ios-install" class="banner-btn" style="display: none;" onclick="PWA.showInstallModal()">Заавар</button>
        <button class="banner-close" onclick="PWA.dismissBanner()">&times;</button>
      </div>
    </div>

    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-brand" onclick="App.navigate('home')">
        <img src="assets/logo.jpg" alt="MONGOLIAN MEDIA Logo" class="header-logo">
        <div class="brand-titles">
          <h1>MONGOLIAN MEDIA</h1>
          <span class="tagline">Солонгос хэл — өдөр тутам ба ажил</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle-btn" class="icon-btn" title="Өнгөний горим солих">
          <span id="theme-icon">🌙</span>
        </button>
        <button class="icon-btn" onclick="App.navigate('profile')" title="Хувийн тохиргоо">
          <span>👤</span>
        </button>
      </div>
    </header>

    <!-- Dynamic Content Area -->
    <main id="main-content">
      <!-- Injected via app.js -->
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <button class="nav-item active" data-view="home">
      <span class="nav-icon">🏠</span>
      <span>Нүүр</span>
    </button>
    <button class="nav-item" data-view="alphabet">
      <span class="nav-icon">🔤</span>
      <span>Үсэг</span>
    </button>
    <button class="nav-item" data-view="lessons-list">
      <span class="nav-icon">📚</span>
      <span>Хичээл</span>
    </button>
    <button class="nav-item" data-view="review">
      <span class="nav-icon">🔄</span>
      <span>Давтлага</span>
    </button>
    <button class="nav-item" data-view="vocab">
      <span class="nav-icon">⭐</span>
      <span>Үгс</span>
    </button>
    <button class="nav-item" data-view="profile">
      <span class="nav-icon">👤</span>
      <span>Профайл</span>
    </button>
  </nav>

  <!-- Global Modal Overlay -->
  <div id="app-modal-overlay" class="modal-overlay" onclick="if(event.target===this) App.closeModal()">
    <div class="modal-content">
      <button class="modal-close" onclick="App.closeModal()">&times;</button>
      <h3 id="modal-title-text" style="font-size: 16px; font-weight: 800; margin-bottom: 14px; color: var(--text-main);">Гарчиг</h3>
      <div id="modal-body-area"></div>
    </div>
  </div>

  <!-- Application Logic Scripts -->
  <script src="js/api.js"></script>
  <script src="js/storage_manager.js"></script>
  <script src="js/speech_engine.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/alphabet_data.js"></script>
  <script src="js/curriculum_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

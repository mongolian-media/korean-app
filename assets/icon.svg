<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="swirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#swirl)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Stylized MONGOLIAN MEDIA Emblem -->
  <!-- Outer Swirl Ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#swirl)" stroke-width="28" stroke-linecap="round" stroke-dasharray="600 120" filter="url(#glow)"/>
  
  <!-- Center Shutter Circle -->
  <circle cx="256" cy="220" r="90" fill="#1E293B"/>
  <circle cx="256" cy="220" r="60" fill="#0EA5E9"/>
  <circle cx="256" cy="220" r="28" fill="#EF4444"/>

  <!-- REC Pill -->
  <rect x="196" y="340" width="120" height="42" rx="21" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="224" cy="361" r="9" fill="#EF4444"/>
  <text x="268" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">REC</text>

  <!-- App Title Text -->
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">MONGOLIAN MEDIA</text>
  <text x="256" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="1">СОЛОНГОС ХЭЛ 30</text>
</svg>

<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MON KOR">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180-v62.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/app-icon-512.png">
  <link rel="shortcut icon" type="image/png" href="/favicon.png">
  <title>MONGOLIAN MEDIA — Солонгос хэлний сургалт</title>
  <link rel="stylesheet" href="css/glassmorphism.css">
</head>
<body>
  <!-- Atmospheric Sunset Rider Wallpaper Background -->
  <div class="app-wallpaper-container">
    <div class="app-wallpaper-bg"></div>
    <div class="app-wallpaper-tint"></div>
  </div>

  <!-- Fullscreen 9:16 Intro Video Overlay -->
  <div id="intro-overlay">
    <button id="intro-audio-btn" class="intro-ctrl-btn intro-audio-btn" type="button" onclick="App.toggleIntroAudio()" title="Дуу асаах">
      🔈 <span>Дуу асаах</span>
    </button>
    <video
      id="intro-video"
      poster="assets/intro_poster.jpg"
      playsinline
      webkit-playsinline
      muted
      preload="auto"
      src="assets/intro.mp4?v=71"
    ></video>
  </div>
  <script>
    if (sessionStorage.getItem('mm_intro_shown') === '1') {
      var ov = document.getElementById('intro-overlay');
      if (ov) ov.style.display = 'none';
    }
  </script>

  <!-- Main Container -->
  <div class="app-container">
    <!-- PWA Installation Banner -->
    <div id="pwa-install-bar">
      <div class="banner-left">
        <span style="font-size: 20px;">📲</span>
        <span>Аппыг гар утсан дээрээ суулгах уу?</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="btn-pwa-install" class="banner-btn" style="display: none;">Суулгах</button>
        <button id="btn-ios-install" class="banner-btn" style="display: none;" onclick="PWA.showInstallModal()">Заавар</button>
        <button class="banner-close" onclick="PWA.dismissBanner()">&times;</button>
      </div>
    </div>

    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-brand" onclick="App.navigate('home')">
        <img src="assets/mon_kor_logo.png" alt="MON KOR Logo" class="header-logo">
        <div class="brand-titles">
          <h1>СОЛОНГОС ХЭЛНИЙ АПП</h1>
          <span class="tagline">өдөр бүр суралц</span>
        </div>
      </div>
      <div class="header-actions">
        <a href="https://www.facebook.com/MediaGorrr" id="header-fb-btn" class="icon-btn fb-header-btn" title="СОЛОНГОС ХЭЛНИЙ АПП Facebook" target="_blank" rel="noopener noreferrer" onclick="App.openFacebook(event)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
        <button id="theme-toggle-btn" class="icon-btn" title="Өнгөний горим солих">
          <span id="theme-icon">🌙</span>
        </button>
        <button class="icon-btn" onclick="App.navigate('profile')" title="Хувийн тохиргоо">
          <span>👤</span>
        </button>
      </div>
    </header>

    <!-- Dynamic Content Area -->
    <main id="main-content">
      <!-- Injected via app.js -->
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <button class="nav-item active" data-view="home">
      <span class="nav-icon">🏠</span>
      <span>Нүүр</span>
    </button>
    <button class="nav-item" data-view="alphabet">
      <span class="nav-icon">🔤</span>
      <span>Үсэг</span>
    </button>
    <button class="nav-item" data-view="lessons-list">
      <span class="nav-icon">📚</span>
      <span>Хичээл</span>
    </button>
    <button class="nav-item" data-view="review">
      <span class="nav-icon">🔄</span>
      <span>Давтлага</span>
    </button>
    <button class="nav-item" data-view="vocab">
      <span class="nav-icon">⭐</span>
      <span>Үгс</span>
    </button>
    <button class="nav-item" data-view="profile">
      <span class="nav-icon">👤</span>
      <span>Профайл</span>
    </button>
  </nav>

  <!-- Global Modal Overlay -->
  <div id="app-modal-overlay" class="modal-overlay" onclick="if(event.target===this) App.closeModal()">
    <div class="modal-content">
      <button class="modal-close" onclick="App.closeModal()">&times;</button>
      <h3 id="modal-title-text" style="font-size: 16px; font-weight: 800; margin-bottom: 14px; color: var(--text-main);">Гарчиг</h3>
      <div id="modal-body-area"></div>
    </div>
  </div>

  <!-- Application Logic Scripts -->
  <script src="js/pwa.js"></script>
  <script src="js/api.js"></script>
  <script src="js/storage_manager.js"></script>
  <script src="js/speech_engine.js"></script>
  <script src="js/alphabet_data.js"></script>
  <script src="js/curriculum_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
